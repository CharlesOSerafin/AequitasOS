services:
  db:
    image: postgres:16
    container_name: aequitas-db
    restart: always
    environment:
      POSTGRES_USER: aequitas
      POSTGRES_PASSWORD: strongpassword
      POSTGRES_DB: aequitas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: